name: Release

on:
  push:
    tags: ["v*"]

# Publishing is what this workflow is for, so it runs the suite again rather than trusting that the commit was green:
# a tag can be moved, and the thing being published is the tag, not the branch it once pointed at.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing, so no token is stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci

      # A tag that disagrees with the manifest publishes a version nobody asked for, and npm will not let it be
      # taken back: the number is spent whether or not the package is later unpublished.
      - name: The tag and the manifest must name the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $manifest" >&2
            exit 1
          fi
          echo "releasing $manifest"

      - run: npm test
      - run: npm run build

      # What a stranger installs, on a machine holding nothing of ours. The picker image needs a Linux daemon,
      # which this runner has.
      - run: npm run test:docker

      # Trusted publishing (OIDC) when the package is configured to trust this repository on npmjs.com, which stores
      # no token anywhere; NPM_TOKEN is used instead when that secret is set.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
